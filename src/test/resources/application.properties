# Banco descartavel: os testes nunca usam o MySQL da aplicacao.
spring.datasource.url=jdbc:h2:mem:seguranca;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
upload.dir=${java.io.tmpdir}/ocorrencias-security-tests
app.frontend-origin=http://localhost:5173
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
